<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import from drip — My Cycle Keeper</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .tool-card {
    background: var(--card);
    border-radius: 1rem;
    padding: 1.75rem 1.5rem;
    max-width: 420px;
    width: 100%;
    line-height: 1.55;
  }
  .tool-card h1 { font-size: 1.35rem; margin: 0 0 0.75rem; }
  .tool-card p { color: var(--text-muted, #888); font-size: 0.95rem; margin: 0 0 1rem; }
  .tool-card a {
    color: var(--rose, #e5455e);
    font-weight: 600;
    text-decoration: none;
  }
  .tool-card a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="tool-card">
    <h1>Import moved into the app</h1>
    <p>
      This standalone import page is retired. drip and My Calendar exports are imported
      from inside My Cycle Keeper so your session stays unlocked.
    </p>
    <p>
      Unlock the app, then open <strong>Settings → Import from another app</strong>
      and choose your source (drip or My Calendar).
    </p>
    <p><a href="./">Open My Cycle Keeper</a></p>
  </div>
</body>
</html>
